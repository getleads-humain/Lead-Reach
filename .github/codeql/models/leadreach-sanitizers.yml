# LeadReach CodeQL Data Extensions
# =================================
# Registers custom SSRF sanitizer functions so CodeQL's dataflow analysis
# recognizes them as sanitizer barriers for the js/server-side-request-forgery
# query.
#
# IMPORTANT: the format is `addsTo: sanitizers` (the extensible name from
# the `codeql/javascript` pack), NOT `addsTo: javascript/request-forgery`
# (that's a query ID and is silently ignored by CodeQL's data extension
# loader).
#
# The `kind` field is `"url-sanitizing"` — this is the sanitizer kind
# recognized by CodeQL JavaScript's `RequestForgery.qll` library via
# `customSanitizer()` in `CustomSanitizers.qll`.
#
# The package field is left empty ("") so the sanitizer matches ANY module
# that defines a function with that name. This avoids fragility from
# TypeScript path-alias resolution (e.g. `@/lib/url-guard` resolves
# differently in tsconfig vs CodeQL's analyzer). The function names are
# sufficiently unique that false positives are unlikely.

extensions:
  - addsTo:
      extensible: sanitizers
      pack: codeql/javascript
    data:
      # src/lib/url-guard.ts — sanitizeUrl (async, for fetch/http.request)
      - ["", "Function", "sanitizeUrl", "Argument[0]", "ReturnValue", "url-sanitizing"]
      # src/lib/url-guard.ts — sanitizeBrowserUrl (sync, for page.goto)
      - ["", "Function", "sanitizeBrowserUrl", "Argument[0]", "ReturnValue", "url-sanitizing"]
