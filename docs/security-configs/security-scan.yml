# LeadReach — Security Scan Workflow
# =====================================
# Runs secret detection (Trufflehog), SAST (Semgrep), and npm audit.
# Runs on every PR and weekly on the main branch.
#
# @see SECURITY_POLICY.md §15.2, §16.1

name: "Security Scanning"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ── Secret Detection ──────────────────────────────────────────────
  trufflehog:
    name: Trufflehog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Trufflehog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── SAST with Semgrep ─────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/xss
            p/sql-injection
            p/command-injection
            p/insecure-transport
            p/jwt
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ── npm Audit ─────────────────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --production
        continue-on-error: false

      - name: Check for known vulnerabilities
        run: |
          npx better-npm-audit audit --level moderate || true
