# LeadReach — CodeQL Analysis Workflow
# =======================================
# Automated static analysis for TypeScript/JavaScript codebase.
# Runs on every PR and weekly on the main branch.
#
# @see SECURITY_POLICY.md §15.2

name: "CodeQL Security Analysis"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze TypeScript/JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ['typescript', 'javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/*.min.js'
              - '**/*.bundle.js'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

      - name: Upload CodeQL results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
